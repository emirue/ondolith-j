# 도구 판 고정. mise install --locked 로 설치한다(판은 mise.lock 이 기준).
[tools]
java = "temurin-25"
node = "26.13.0"

# 무거운 작업은 nice 19 로, 한 번에 하나씩(CLAUDE.md 「CPU·메모리」).
[tasks.test]
description = "셸 시험 + 백엔드 시험(Testcontainers, Docker 필요) + 프런트 시험·타입 검사"
run = [
  "for t in tests/*.test.sh; do bash \"$t\" || exit 1; done",
  "cd src/back && nice -n 19 ./mvnw -q -B test",
  "cd src/front && nice -n 19 npm test && npm run typecheck",
]

[tasks.db]
description = "개발용 PostgreSQL(127.0.0.1:5432, 가짜 계정 dev/dev). 끝나면 docker rm -f ondolith-dev-db"
run = "docker run -d --name ondolith-dev-db -p 127.0.0.1:5432:5432 -e POSTGRES_USER=dev -e POSTGRES_PASSWORD=dev -e POSTGRES_DB=ondolithj postgres:18-alpine"

[tasks.e2e]
description = "실제 jar 로 브라우저 흐름 시험(Docker 필요)"
run = [
  "cd src/back && nice -n 19 ./mvnw -q -B -DskipTests package",
  "cd src/front && nice -n 19 npx playwright test",
]
