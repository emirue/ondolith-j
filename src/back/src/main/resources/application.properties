spring.application.name=ondolith-j
# API 의 JSON 필드는 snake_case(ondolith D19 와 같은 이름)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.mvc.problemdetails.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# 요청 본문과 검증 실패 값(rejected value)을 DEBUG 로 찍는 로거. 설치 요청의 비밀번호가 로그에 남지 않게
# 다른 로거를 DEBUG 로 올려도 이것은 INFO 로 둔다(스펙 2.2 「로그에도 남기지 않는다」)
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
