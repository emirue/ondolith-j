spring.application.name=ondolith-j
# API 의 JSON 필드는 snake_case(ondolith D19 와 같은 이름)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.mvc.problemdetails.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# 요청이 끝날 때마다 내는 ServletRequestHandledEvent 를 끈다. 이벤트가 getUserPrincipal() 을 불러
# 권한 지연 로드를 깨워, 공개 API 까지 요청마다 DB 를 읽었다(1-A 스펙 3.4). 이 이벤트를 쓰는 곳은 없다
spring.mvc.publish-request-handled-events=false
# 세션 표는 Flyway V2 가 만든다. 수명 12시간(ondolith D60 NFR-204), 기동 인자로 바꿀 수 있다
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=12h
# 요청 본문과 검증 실패 값(rejected value)을 DEBUG 로 찍는 로거. 설치 요청의 비밀번호가 로그에 남지 않게
# 다른 로거를 DEBUG 로 올려도 이것은 INFO 로 둔다(스펙 2.2 「로그에도 남기지 않는다」)
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
